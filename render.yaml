services:
  - type: web
    name: python-qa-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HUGGINGFACEHUB_API_TOKEN
        sync: false
      - key: USE_OLLAMA
        value: "false"
      - key: LLM_MODEL_ID
        value: mistralai/Mistral-7B-Instruct-v0.3
      - key: EMBEDDING_MODEL_ID
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: RERANKER_MODEL_ID
        value: cross-encoder/ms-marco-MiniLM-L-6-v2
      - key: CHROMA_PERSIST_DIR
        value: ./vector_store
      - key: COLLECTION_NAME
        value: stackoverflow_python
      - key: TOP_K_RETRIEVAL
        value: "10"
      - key: TOP_K_RERANK
        value: "3"
      - key: MAX_NEW_TOKENS
        value: "512"
      - key: APP_HOST
        value: "0.0.0.0"
      - key: APP_PORT
        value: "8000"
